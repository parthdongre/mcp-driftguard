name: Poisoning Ablation Suite

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/driftguard/research_baselines.py
      - src/driftguard/poisoning.py
      - src/driftguard/hybrid_detector.py
      - src/driftguard/structural_security.py
      - src/driftguard/calibration.py
      - src/driftguard/poisoning_benchmark.py
      - src/driftguard/poisoning_challenges.py
      - experiments/run_poisoning_ablation_suite.py
      - .github/workflows/poisoning-ablation-suite.yml

permissions:
  contents: read

jobs:
  ablations:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]" "scikit-learn>=1.5"
      - name: Run controlled ablation suite
        run: python experiments/run_poisoning_ablation_suite.py --repositories 80
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: poisoning-ablation-suite
          path: artifacts/poisoning_ablation_suite.json
          if-no-files-found: error
          retention-days: 30

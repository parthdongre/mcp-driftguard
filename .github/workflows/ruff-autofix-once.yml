name: Ruff Autofix Once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ruff-autofix-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install tooling
        run: pip install -e ".[dev]" "scikit-learn>=1.5"
      - name: Apply Ruff fixes
        run: ruff check src tests --fix
      - name: Remove one-shot workflow and push fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ruff-autofix-once.yml
          if git diff --cached --quiet && git diff --quiet; then
            exit 0
          fi
          git add -A
          git commit -m "Apply Ruff autofix"
          git push origin HEAD:main

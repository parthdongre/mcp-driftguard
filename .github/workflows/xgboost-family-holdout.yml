name: XGBoost Attack Family Holdout

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/driftguard/tree_learning.py
      - src/driftguard/xgboost_family_benchmark.py
      - src/driftguard/learned_family_benchmark.py
      - src/driftguard/features.py
      - tests/test_xgboost_family_benchmark.py
      - experiments/run_xgboost_family_holdout.py
      - .github/workflows/xgboost-family-holdout.yml

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]" "scikit-learn>=1.5" "xgboost>=2.1"
      - name: Test XGBoost family holdout
        run: pytest -q tests/test_xgboost_family_benchmark.py
      - name: Run XGBoost repository and family holdout benchmark
        shell: bash
        run: |
          set -o pipefail
          python experiments/run_xgboost_family_holdout.py | tee xgboost-family-holdout.json
      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: xgboost-family-holdout
          path: xgboost-family-holdout.json
          if-no-files-found: error
          retention-days: 30

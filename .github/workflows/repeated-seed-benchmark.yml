name: Repeated Seed Poisoning Benchmark

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - experiments/run_repeated_seed_poisoning.py
      - .github/workflows/repeated-seed-benchmark.yml

permissions:
  contents: read

jobs:
  repeated-seed:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]" "scikit-learn>=1.5"
      - name: Run five-seed development evaluation
        run: python experiments/run_repeated_seed_poisoning.py --repositories 80
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: repeated-seed-poisoning
          path: artifacts/repeated_seed_poisoning.json
          if-no-files-found: error
          retention-days: 30

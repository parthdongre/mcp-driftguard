name: Temporal Strategy Benchmark

on:
  push:
    branches: [main]
    paths:
      - "src/driftguard/trajectory_benchmark.py"
      - "src/driftguard/temporal.py"
      - "src/driftguard/bounded_drift.py"
      - "src/driftguard/consent_policy.py"
      - "src/driftguard/mutations.py"
      - "experiments/run_temporal_strategy_benchmark.py"
      - ".github/workflows/temporal-strategy-benchmark.yml"
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Compare temporal strategies
        shell: bash
        run: |
          set -o pipefail
          python experiments/run_temporal_strategy_benchmark.py | tee temporal-strategy-benchmark.json
      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: temporal-strategy-benchmark
          path: temporal-strategy-benchmark.json
          if-no-files-found: error
          retention-days: 30

name: Learned Attack Family Holdout

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/driftguard/learning.py
      - src/driftguard/learned_family_benchmark.py
      - src/driftguard/attack_family_benchmark.py
      - src/driftguard/stateful_policy.py
      - tests/test_learned_family_benchmark.py
      - experiments/run_learned_family_holdout.py
      - .github/workflows/learned-family-holdout.yml

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]" "scikit-learn>=1.5"
      - name: Test learned family holdout invariants
        run: pytest -q tests/test_learned_family_benchmark.py
      - name: Run learned repository and family holdout benchmark
        shell: bash
        run: |
          set -o pipefail
          python experiments/run_learned_family_holdout.py | tee learned-family-holdout.json
      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: learned-family-holdout
          path: learned-family-holdout.json
          if-no-files-found: error
          retention-days: 30

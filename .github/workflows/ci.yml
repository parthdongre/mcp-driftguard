name: CI

on:
  push:
    branches: [main, "dev/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests experiments
      - name: Test
        run: pytest -q

  ml-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install classical ML extras
        run: pip install -e ".[dev,ml]"
      - name: Test learned pairwise detector
        run: pytest -q tests/test_ml.py tests/test_features.py


  api-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install API extras
        run: pip install -e ".[dev,api]"
      - name: Test API control plane
        run: pytest -q tests/test_api_smoke.py tests/test_sse.py tests/test_ui.py
      - name: Check UI JavaScript syntax
        run: node --check src/driftguard/ui/app.js


  ui-visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install API extras
        run: pip install -e ".[dev,api]"
      - name: Start DriftGuard dashboard
        run: |
          uvicorn driftguard.api:create_app --factory --host 127.0.0.1 --port 8765 > /tmp/driftguard-ui.log 2>&1 &
          echo $! > /tmp/driftguard-ui.pid
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8765/health >/dev/null; then
              exit 0
            fi
            sleep 0.5
          done
          cat /tmp/driftguard-ui.log
          exit 1
      - name: Capture browser screenshots
        run: |
          mkdir -p ui-artifacts
          BROWSER="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          if [ -z "$BROWSER" ]; then
            echo "No Chromium-compatible browser found on runner"
            exit 1
          fi

          capture() {
            local output="$1"
            local size="$2"
            local budget="$3"
            local url="$4"
            timeout 25s "$BROWSER" --headless=new --no-sandbox --disable-gpu --hide-scrollbars               --window-size="$size"               --virtual-time-budget="$budget"               --screenshot="$output"               "$url" || true
            test -s "$output"
          }

          capture ui-artifacts/driftguard-overview.png 1600,1100 2500 "http://127.0.0.1:8765/?demo=1"
          capture ui-artifacts/driftguard-revision-inspector.png 1600,1100 3000 "http://127.0.0.1:8765/?demo=1&inspect=latest"
          capture ui-artifacts/driftguard-mobile.png 430,932 2500 "http://127.0.0.1:8765/?demo=1"
          file ui-artifacts/*.png
      - name: Upload dashboard screenshots
        uses: actions/upload-artifact@v4
        with:
          name: driftguard-ui-screenshots
          path: ui-artifacts/*.png
          if-no-files-found: error

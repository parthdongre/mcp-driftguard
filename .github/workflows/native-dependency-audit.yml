name: Native dependency evidence

on:
  workflow_dispatch:
  push:
    branches: ["dev/**"]
    paths:
      - "desktop/src-tauri/Cargo.lock"
      - "desktop/src-tauri/Cargo.toml"
      - "desktop/src-tauri/third_party/**"
      - "desktop/scripts/audit-native.py"
      - ".github/workflows/native-dependency-audit.yml"
  pull_request:
    branches: [main]
    paths:
      - "desktop/src-tauri/**"
      - "desktop/scripts/audit-native.py"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned RustSec client
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Preserve raw advisories and verify compatibility-source exceptions
        run: python desktop/scripts/audit-native.py
      - name: Retain raw and interpreted dependency evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-dependency-evidence
          path: desktop/build/security/
          retention-days: 30

name: Expanded Corpus Pilot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/public_corpus_expansion.json"
      - "src/driftguard/corpus_discovery.py"
      - "src/driftguard/extractors.py"
      - "experiments/build_public_corpus.py"
      - ".github/workflows/expanded-corpus-pilot.yml"

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Mine six independent public MCP repositories
        run: |
          python experiments/build_public_corpus.py \
            --manifest data/public_corpus_expansion.json \
            --workspace .corpus/expanded-pilot \
            --output artifacts/expanded_history_candidates.jsonl \
            --summary artifacts/expanded_history_summary.json \
            --only financial-datasets/mcp-server \
            --only zcaceres/markdownify-mcp \
            --only zcaceres/fetch-mcp \
            --only blazickjp/arxiv-mcp-server \
            --only nickclyde/duckduckgo-mcp-server \
            --only alpacahq/alpaca-mcp-server
      - name: Upload static extraction evidence
        uses: actions/upload-artifact@v4
        with:
          name: expanded-corpus-pilot
          path: |
            artifacts/expanded_history_candidates.jsonl
            artifacts/expanded_history_summary.json
          if-no-files-found: error
          retention-days: 30

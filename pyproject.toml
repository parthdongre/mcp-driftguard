[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-driftguard"
version = "0.4.0"
description = "Proprietary research prototype for consent-aware temporal MCP tool-definition security"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary - All Rights Reserved" }
authors = [{ name = "Parth Dongre" }]
dependencies = [
  "pydantic>=2.8,<3",
]

[project.optional-dependencies]
ml = [
  "numpy>=1.26",
  "scikit-learn>=1.5",
  "sentence-transformers>=3.0",
  "xgboost>=2.1",
]
api = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
]
dev = [
  "pytest>=8.2",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
